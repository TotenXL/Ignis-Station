    species: Felinid

- type: entity
  parent:
  - AppearanceFelinid
  - BaseSpeciesMobOrganic
  id: MobFelinid
  name: Urist McFelinid
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.28
        density: 140
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 3
  - type: Damageable
    damageModifierSet: Felinid
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.85
      80: 0.75
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 4
        Piercing: 1
  - type: Stamina
  - type: Speech
    speechSounds: Alto
    speechVerb: Felinid
    allowedEmotes:
    - Hiss
    - Meow
    - Mew
    - Growl
    - Purr
  - type: TypingIndicator
    proto: felinid
  - type: Vocal
    emoteSounds: MaleFelinid
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_human
  - type: ItemCougher
    item: Hairball
    action: ActionHairball
    coughPopup: hairball-cough
  - type: Felinid
  - type: NpcFactionMember
    factions:
    - NanoTrasen
    - Felinid


- type: entity
  parent: BaseItem
  id: Hairball
  name: hairball
  description: Felinids, man...
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Specific/Species/felinid.rsi
    state: icon
  - type: Hairball
  # Nyanotrasen - Felinid: LandAtCursor so a thrown hairball actually reaches and hits the target
  # instead of coasting to a stop just short of them (friction-compensated throws drop the hit fixture early).
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 1
  # Nyanotrasen - Felinid: self-solution named "hairball" (this fork's chemistry API);
  # the old inline SolutionContainerManager gets its solution deleted by the compat shim.
  - type: Solution
    id: hairball
    solution:
      maxVol: 25
      reagents:
      - ReagentId: Protein
        Quantity: 2
  - type: Extractable
    grindableSolutionName: hairball
  - type: Tag
    tags:
    - Recyclable
    - Trash
    - Hairball
  - type: FoodSequenceElement
    entries:
      Burger: Hairball
      Taco: Hairball
      Skewer: Hairball
    solution: hairball
  - type: Edible
    requiresSpecialDigestion: true
    solution: hairball

# Ported from RMC-14: Resources/Prototypes/_RMC14/Entities/Objects/Weapons/Guns/Rifles/m54c_rifle.yml
# RMC-14 runs a bespoke gun stack (RMCSelectiveFire, AttachableHolder, ItemCamouflage,
# CMArmorPiercing, RefillableByBulletBox, chamber-less mag feed, ...). This re-expresses the
# M54C with vanilla SS14 components, keeping its identity: standard-issue full-auto marine
# rifle, selective fire, 10x24mm caseless ammo, 40-round mags (+ AP / Incendiary / Extended).
# Sprites & audio copied from RMC-14 under _IS/ (see the matching .rsi meta.json for credits).

- type: entity
  name: M54C assault rifle
  parent: [BaseWeaponRifle, BaseSecurityContraband]
  id: WeaponRifleM54C
  description: The standard issue rifle of the Marines, commonly carried by most combat personnel. Uses 10x24mm caseless ammunition.
  components:
  - type: Sprite
    sprite: _IS/Objects/Weapons/Guns/Rifles/m54c/desert.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _IS/Objects/Weapons/Guns/Rifles/m54c/desert.rsi
  # ISScatter owns the wielded/unwielded split, so zero out the one inherited from
  # BaseGunWieldable (-20/-30) rather than have two systems fight over MinAngle/MaxAngle.
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
    angleIncrease: 0
    angleDecay: 0
  # RMC-style scatter: flat cone on semi-auto, climbing on burst and full auto, and
  # much worse when fired from the hip. Values carried over from RMC's M54C.
  - type: ISScatter
    scatterWielded: 6
    scatterUnwielded: 20
    recoilUnwielded: 4
    baseFireRate: 4
    burstScatterMult: 1
  - type: Gun
    shotsPerBurst: 3
    selectedMode: FullAuto
    availableModes:
      - FullAuto
      - Burst
      - SemiAuto
    # minAngle/maxAngle/angleIncrease/angleDecay/fireRate/cameraRecoilScalar are all
    # computed by ISScatter at refresh time; setting them here would have no effect.
    soundGunshot:
      path: /Audio/_IS/Weapons/Guns/Gunshots/gun_m54c_1.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: null
        insertSound: /Audio/_IS/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_IS/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineRifleM54C
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgeRifleM54C
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: AttachableHolder
    slots:
      is-aslot-barrel:
        name: is-attachable-slot-barrel
        whitelist:
          tags:
          - ISAttachmentBarrel
      is-aslot-rail:
        name: is-attachable-slot-rail
        whitelist:
          tags:
          - ISAttachmentRail
      is-aslot-stock:
        name: is-attachable-slot-stock
        startingAttachable: ISAttachmentM54CStockCollapsible
        whitelist:
          tags:
          - ISAttachmentStock
      is-aslot-underbarrel:
        name: is-attachable-slot-underbarrel
        whitelist:
          tags:
          - ISAttachmentUnderbarrel
  # Offsets carried over from RMC's M54C; tweak if an attachment sits visibly off the rail.
  - type: AttachableHolderVisuals
    offsets:
      is-aslot-barrel: 0.8425, 0.001
      is-aslot-rail: 0.1, 0.16
      is-aslot-stock: -0.78, 0.0325
      is-aslot-underbarrel: 0.349, -0.375

- type: entity
  parent: WeaponRifleM54C
  id: WeaponRifleM54CFilled
  suffix: Filled
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifleM54C
        insertSound: /Audio/_IS/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_IS/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineRifleM54C
        whitelistFailPopup: gun-magazine-whitelist-fail

# --- Magazines ---------------------------------------------------------------

- type: entity
  abstract: true
  parent: [BaseItem, BaseSecurityContraband]
  id: BaseMagazineRifleM54C
  name: "M54C magazine (10x24mm)"
  components:
  - type: Tag
    tags:
      - MagazineRifleM54C
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    capacity: 40
    whitelist:
      tags:
        - CartridgeRifleM54C
    proto: CartridgeRifleM54C
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _IS/Objects/Weapons/Guns/Ammunition/Magazines/m54c.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance

- type: entity
  parent: BaseMagazineRifleM54C
  id: MagazineRifleM54C
  name: "M54C magazine (10x24mm)"
  description: A 40-round magazine of 10x24mm caseless ammunition for the M54C assault rifle.

- type: entity
  parent: MagazineRifleM54C
  id: MagazineRifleM54CEmpty
  suffix: empty
  components:
  - type: BallisticAmmoProvider
    proto: null

- type: entity
  parent: BaseMagazineRifleM54C
  id: MagazineRifleM54CAP
  name: "M54C AP magazine (10x24mm)"
  suffix: AP
  description: A 40-round magazine of armor-piercing 10x24mm caseless ammunition for the M54C assault rifle.
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    capacity: 40
    whitelist:
      tags:
        - CartridgeRifleM54CAP
    proto: CartridgeRifleM54CAP
  - type: Sprite
    sprite: _IS/Objects/Weapons/Guns/Ammunition/Magazines/m54c.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

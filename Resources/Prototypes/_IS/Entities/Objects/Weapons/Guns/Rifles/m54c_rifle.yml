- type: entity
  parent: BaseMagazineRifleM54C
  id: MagazineRifleM54CIncendiary
  name: "M54C incendiary magazine (10x24mm)"
  suffix: Incendiary
  description: A 40-round magazine of self-igniting incendiary 10x24mm caseless ammunition for the M54C assault rifle.
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    capacity: 40
    whitelist:
      tags:
        - CartridgeRifleM54CIncendiary
    proto: CartridgeRifleM54CIncendiary
  - type: Sprite
    sprite: _IS/Objects/Weapons/Guns/Ammunition/Magazines/m54c.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ammo_band
      color: "#771A10"

- type: entity
  parent: BaseMagazineRifleM54C
  id: MagazineRifleM54CExtended
  name: "M54C extended magazine (10x24mm)"
  suffix: Extended
  description: An extended 60-round magazine of 10x24mm caseless ammunition for the M54C assault rifle.
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    capacity: 60
    whitelist:
      tags:
        - CartridgeRifleM54C
    proto: CartridgeRifleM54C
  - type: Sprite
    sprite: _IS/Objects/Weapons/Guns/Ammunition/Magazines/m54ce.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false

# --- Cartridges (caseless: no casing left behind) ---------------------------

- type: entity
  abstract: true
  parent: [BaseCartridge, BaseSecurityContraband]
  id: BaseCartridgeRifleM54C
  name: cartridge (10x24mm)
  components:
  - type: Tag
    tags:
      - CartridgeRifleM54C
  - type: CartridgeAmmo
    proto: BulletRifleM54C
    deleteOnSpawn: true
    muzzleFlash: MuzzleFlashEffectM54C
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgeRifleM54C
  id: CartridgeRifleM54C
  name: cartridge (10x24mm)
  description: A 10x24mm caseless cartridge. Fits in M54C magazines.

- type: entity
  parent: BaseCartridgeRifleM54C
  id: CartridgeRifleM54CAP
  name: AP cartridge (10x24mm)
  description: An armor-piercing 10x24mm caseless cartridge. Fits in M54C AP magazines.
  components:
  - type: Tag
    tags:
      - CartridgeRifleM54C
      - CartridgeRifleM54CAP
  - type: CartridgeAmmo
    proto: BulletRifleM54CAP
    deleteOnSpawn: true
    muzzleFlash: MuzzleFlashEffectM54C
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#1F951F"

- type: entity
  parent: BaseCartridgeRifleM54C
  id: CartridgeRifleM54CIncendiary
  name: incendiary cartridge (10x24mm)
  description: A self-igniting incendiary 10x24mm caseless cartridge. Fits in M54C incendiary magazines.
  components:
  - type: Tag
    tags:
      - CartridgeRifleM54C
      - CartridgeRifleM54CIncendiary
  - type: CartridgeAmmo
    proto: BulletRifleM54CIncendiary
    deleteOnSpawn: true
    muzzleFlash: MuzzleFlashEffectM54C
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#771A10"

# --- Muzzle flash ---------------------------------------------------------
# Vanilla places the flash a fixed ~0.5 tile in front of the shooter regardless of
# barrel length; the RMC m54c sprite's barrel reaches further, so nudge the effect
# forward/up to sit at the muzzle. Tune the offset to taste.

- type: entity
  parent: MuzzleFlashEffect
  id: MuzzleFlashEffectM54C
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: BelowMobs
    offset: 0.31, 0
    layers:
    - shader: unshaded
      map: [ "enum.EffectLayers.Unshaded" ]
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_bullet

# --- Bullets ---------------------------------------------------------------

- type: entity
  parent: BulletRifle
  id: BulletRifleM54C
  categories: [ HideSpawnMenu ]
  name: bullet (10x24mm)
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 20

- type: entity
  parent: BaseBulletAP
  id: BulletRifleM54CAP
  categories: [ HideSpawnMenu ]
  name: bullet (10x24mm AP)
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 16

- type: entity
  parent: BaseBulletIncendiary
  id: BulletRifleM54CIncendiary
  categories: [ HideSpawnMenu ]
  name: bullet (10x24mm incendiary)
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 15
        Heat: 5

# --- Tags ---------------------------------------------------------------

- type: Tag
  id: MagazineRifleM54C

- type: Tag
  id: CartridgeRifleM54C

- type: Tag
  id: CartridgeRifleM54CAP

- type: Tag
  id: CartridgeRifleM54CIncendiary
